<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교 성적·학생정보 플랫폼 데모</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; background-color: #f8f9fa; }
    h1 { color: #333; font-size: 22px; margin-bottom: 10px; }
    p.sub { color: #666; font-size: 14px; margin-bottom: 20px; }
    
    /* 탭 메뉴 스타일 */
    .tab-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; border-bottom: 2px solid #007bff; padding-bottom: 5px; }
    .tab-btn { padding: 8px 14px; border: 1px solid #ccc; background: #e9ecef; cursor: pointer; border-radius: 4px 4px 0 0; font-size: 13px; font-weight: bold; }
    .tab-btn.active { background: #007bff; color: white; border-color: #007bff; }
    
    /* 테이블 감싸는 스크롤 영역 (잘림 방지) */
    .table-container { width: 100%; overflow-x: auto; background: white; border: 1px solid #dee2e6; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; min-width: 1000px; font-size: 13px; }
    th, td { border: 1px solid #dee2e6; padding: 10px 12px; text-align: center; white-space: nowrap; }
    th { background-color: #f1f3f5; color: #495057; font-weight: bold; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    tr:hover { background-color: #e9ecef; }
    
    .desc-box { background: #e7f5ff; border-left: 4px solid #1c7ed6; padding: 12px; margin-bottom: 15px; font-size: 13px; color: #1864ab; }
  </style>
</head>
<body>

  <h1>🏫 포항세화고등학교 성적·학생정보 플랫폼 데이터 조회</h1>
  <p class="sub">표준 업로드 양식 v1.0의 모든 항목과 데이터가 화면에 표시됩니다.</p>

  <div id="descBox" class="desc-box">시트를 선택하세요.</div>

  <!-- 시트 선택 탭 -->
  <div class="tab-container" id="tabContainer"></div>

  <!-- 데이터 테이블 -->
  <div class="table-container">
    <table id="dataTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script src="data.js"></script>
  <script>
    // 탭 생성 및 데이터 렌더링 로직
    const tabContainer = document.getElementById('tabContainer');
    const descBox = document.getElementById('descBox');
    const tableHead = document.getElementById('tableHead');
    const tableBody = document.getElementById('tableBody');

    let currentSheet = Object.keys(excelData)[0];

    function renderTabs() {
      tabContainer.innerHTML = '';
      Object.keys(excelData).forEach(sheetName => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${sheetName === currentSheet ? 'active' : ''}`;
        btn.innerText = sheetName;
        btn.onclick = () => {
          currentSheet = sheetName;
          renderTabs();
          renderTable();
        };
        tabContainer.appendChild(btn);
      });
    }

    function renderTable() {
      const sheet = excelData[currentSheet];
      descBox.innerText = sheet.description || '선택한 시트의 데이터 목록입니다.';

      // 헤더 생성
      tableHead.innerHTML = `<tr>${sheet.headers.map(h => `<th>${h}</th>`).join('')}</tr>`;

      // 본문 생성
      tableBody.innerHTML = sheet.rows.map(row => {
        return `<tr>${row.map(cell => `<td>${cell !== null && cell !== undefined ? cell : ''}</td>`).join('')}</tr>`;
      }).join('');
    }

    // 초기화 실행
    renderTabs();
    renderTable();
  </script>
</body>
</html>
