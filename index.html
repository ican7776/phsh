<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>학생·성적 종합 정보시스템</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding-bottom: 30px; }
    
    header { background: #004085; color: white; padding: 14px; text-align: center; font-size: 18px; font-weight: bold; }
    .container { padding: 12px; max-width: 600px; margin: 0 auto; }

    /* 최상단 역할 구분 탭 (교사 / 학부모 / 학생) */
    .top-role-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .role-btn { flex: 1; padding: 12px; border: 1px solid #ccc; background: #e9ecef; font-size: 15px; font-weight: bold; color: #495057; border-radius: 6px; cursor: pointer; text-align: center; }
    .role-btn.active { background: #004085; color: white; border-color: #004085; }

    /* 로그인/인증 카드 */
    .card { background: white; padding: 16px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 12px; }
    .card h3 { font-size: 15px; color: #004085; margin-bottom: 10px; }
    .input-row { display: flex; gap: 6px; margin-top: 8px; }
    .input-row input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .btn { padding: 10px 14px; background: #004085; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-green { background: #28a745; }

    /* 학생 선택 드롭다운 */
    .student-dropdown-box { background: white; padding: 12px; border-radius: 8px; border: 1px solid #004085; margin-bottom: 12px; }
    .student-dropdown-box label { font-size: 12px; font-weight: bold; color: #004085; display: block; margin-bottom: 4px; }
    .student-select { width: 100%; padding: 10px; font-size: 15px; font-weight: bold; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; }

    /* 💡 중요: 성적 추이 그래프 영역 (기본 숨김: display: none) */
    .graph-card { background: white; padding: 12px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 12px; display: none; }
    .graph-title { font-size: 14px; font-weight: bold; color: #004085; margin-bottom: 8px; text-align: center; }
    .chart-container { position: relative; width: 100%; height: 220px; }

    /* 기능 서브 탭 */
    .sub-tabs { display: flex; background: #e9ecef; border-bottom: 2px solid #004085; border-radius: 6px 6px 0 0; overflow-x: auto; }
    .sub-tab-btn { flex: 1; min-width: 80px; padding: 10px 6px; font-size: 13px; font-weight: bold; border: none; background: transparent; color: #555; cursor: pointer; text-align: center; white-space: nowrap; }
    .sub-tab-btn.active { background: #004085; color: white; border-radius: 6px 6px 0 0; }

    /* 하단 화면 영역 */
    .tab-view-card { background: white; padding: 14px; border-radius: 0 0 8px 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); min-height: 200px; }
    .data-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #eee; font-size: 13px; }
    .data-row:last-child { border-bottom: none; }
    .data-label { color: #666; }
    .data-val { font-weight: bold; color: #222; }
    .item-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 13px; }
  </style>
</head>
<body>

  <header>포항세화고 학생·성적 종합시스템</header>

  <div class="container">

    <!-- 최상단 메뉴: [교사] [학부모] [학생] -->
    <div class="top-role-tabs">
      <button class="role-btn active" onclick="selectRole('teacher')">교사</button>
      <button class="role-btn" onclick="selectRole('parent')">학부모</button>
      <button class="role-btn" onclick="selectRole('student')">학생</button>
    </div>

    <!-- 교사 로그인 카드 -->
    <div id="teacherLoginCard" class="card">
      <h3>🔒 교사 로그인 (관리자 전용)</h3>
      <div class="input-row">
        <input type="text" id="teacherId" placeholder="아이디 (admin)">
        <input type="password" id="teacherPw" placeholder="비밀번호 (admin)">
        <button class="btn" onclick="loginTeacher()">로그인</button>
      </div>
      <p id="loginMsg" style="font-size:12px; color:red; margin-top:5px;"></p>
    </div>

    <!-- 학부모/학생 본인인증 카드 -->
    <div id="authLoginCard" class="card" style="display:none;">
      <h3 id="authTitle">본인 인증</h3>
      <div class="input-row">
        <input type="tel" id="phoneInput" placeholder="휴대폰 번호 (-없이 입력)">
        <button class="btn" onclick="sendAuthCode()">인증 요청</button>
      </div>
      <div id="authCodeRow" class="input-row" style="display:none;">
        <input type="number" id="codeInput" placeholder="인증번호 6자리">
        <button class="btn btn-green" onclick="verifyAuthCode()">확인</button>
      </div>
      <p id="authMsg" style="font-size:12px; margin-top:5px;"></p>
    </div>

    <!-- 로그인 성공 후 전체 대시보드 -->
    <div id="mainDashboard" style="display:none;">

      <!-- 학생 선택 드롭다운 -->
      <div class="student-dropdown-box">
        <label id="selectLabel">학생 선택 (전체 100명 목록)</label>
        <select id="studentSelect" class="student-select" onchange="onStudentSelectChange()">
          <!-- 동적 학생 목록 -->
        </select>
      </div>

      <!-- 성적 추이 그래프 영역 (내신/모의고사 탭 클릭 시에만 display: block 처리) -->
      <div class="graph-card" id="graphCard">
        <div class="graph-title" id="graphTitle">📈 성적 추이 그래프</div>
        <div class="chart-container">
          <canvas id="scoreChart"></canvas>
        </div>
      </div>

      <!-- 기능 서브 탭 -->
      <div class="sub-tabs">
        <button class="sub-tab-btn active" onclick="switchSubTab('info')">학생기본정보</button>
        <button class="sub-tab-btn" onclick="switchSubTab('grade')">내신성적</button>
        <button class="sub-tab-btn" onclick="switchSubTab('mock')">모의고사</button>
        <button class="sub-tab-btn" onclick="switchSubTab('etc')">출결/창체/진로</button>
      </div>

      <!-- 하단 화면 영역 -->
      <div class="tab-view-card" id="tabViewArea"></div>

    </div>

  </div>

  <script src="data.js"></script>
  <script>
    let currentRole = 'teacher';
    let isTeacherLoggedIn = false;
    let selectedStudentId = null;
    let authCode = '';
    let currentSubTab = 'info';
    let chartInstance = null;

    window.onload = function() {
      selectRole('teacher');
    };

    function selectRole(role) {
      currentRole = role;
      document.querySelectorAll('.role-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (role==='teacher'&&idx===0)||(role==='parent'&&idx===1)||(role==='student'&&idx===2));
      });

      const teacherCard = document.getElementById('teacherLoginCard');
      const authCard = document.getElementById('authLoginCard');
      const dashboard = document.getElementById('mainDashboard');

      dashboard.style.display = 'none';

      if (role === 'teacher') {
        authCard.style.display = 'none';
        if (isTeacherLoggedIn) {
          dashboard.style.display = 'block';
          initTeacherDropdown();
        } else {
          teacherCard.style.display = 'block';
        }
      } else {
        teacherCard.style.display = 'none';
        authCard.style.display = 'block';
        document.getElementById('authTitle').innerText = role === 'parent' ? '👨‍👩‍👧 학부모 본인 인증' : '👨‍🎓 학생 본인 인증';
        document.getElementById('phoneInput').value = role === 'parent' ? '010-2001-2222' : '010-1001-1111';
        document.getElementById('authCodeRow').style.display = 'none';
        document.getElementById('authMsg').innerText = '';
      }
    }

    function loginTeacher() {
      const id = document.getElementById('teacherId').value.trim();
      const pw = document.getElementById('teacherPw').value.trim();

      if (id === 'admin' && pw === 'admin') {
        isTeacherLoggedIn = true;
        document.getElementById('teacherLoginCard').style.display = 'none';
        document.getElementById('mainDashboard').style.display = 'block';
        initTeacherDropdown();
      } else {
        document.getElementById('loginMsg').innerText = '아이디 또는 비밀번호가 올바르지 않습니다. (admin / admin)';
      }
    }

    function sendAuthCode() {
      const phone = document.getElementById('phoneInput').value.trim();
      let st = null;
      if (currentRole === 'student') st = excelData["01_학생명렬표"].rows.find(s => s.학생휴대폰 === phone);
      else st = excelData["01_학생명렬표"].rows.find(s => s.보호자1_휴대폰 === phone);

      if (!st) {
        document.getElementById('authMsg').style.color = 'red';
        document.getElementById('authMsg').innerText = '등록된 연락처가 없습니다.';
        return;
      }

      selectedStudentId = st.학번;
      authCode = Math.floor(100000 + Math.random() * 900000).toString();
      document.getElementById('authCodeRow').style.display = 'flex';
      document.getElementById('authMsg').style.color = 'blue';
      document.getElementById('authMsg').innerText = `[SMS 발송] 인증번호: ${authCode}`;
    }

    function verifyAuthCode() {
      if (document.getElementById('codeInput').value.trim() === authCode) {
        alert('인증되었습니다.');
        document.getElementById('authLoginCard').style.display = 'none';
        document.getElementById('mainDashboard').style.display = 'block';
        
        const select = document.getElementById('studentSelect');
        const st = excelData["01_학생명렬표"].rows.find(s => s.학번 === selectedStudentId);
        select.innerHTML = `<option value="${st.학번}">[${st.학번}] ${st.성명} (본인)</option>`;
        document.getElementById('selectLabel').innerText = "본인 학생 정보";
        switchSubTab('info');
      } else {
        alert('인증번호가 일치하지 않습니다.');
      }
    }

    function initTeacherDropdown() {
      const select = document.getElementById('studentSelect');
      select.innerHTML = '';
      excelData["01_학생명렬표"].rows.forEach(st => {
        const opt = document.createElement('option');
        opt.value = st.학번;
        opt.innerText = `[${st.학번}] ${st.성명} (${st.반}반 ${st.번호}번)`;
        select.appendChild(opt);
      });
      document.getElementById('selectLabel').innerText = "학생 선택 (전체 100명 목록)";
      selectedStudentId = excelData["01_학생명렬표"].rows[0].학번;
      switchSubTab('info');
    }

    function onStudentSelectChange() {
      selectedStudentId = document.getElementById('studentSelect').value;
      updateView();
    }

    // 💡 핵심 개선: 서브 탭 변경 시 그래프 상자 숨김/노출 및 차트 생성 제어
    function switchSubTab(tab) {
      currentSubTab = tab;
      document.querySelectorAll('.sub-tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (tab==='info'&&idx===0)||(tab==='grade'&&idx===1)||(tab==='mock'&&idx===2)||(tab==='etc'&&idx===3));
      });

      const graphCard = document.getElementById('graphCard');

      // '내신성적' 또는 '모의고사' 탭일 때만 그래프 상자를 열고 그래프 그리기
      if (tab === 'grade' || tab === 'mock') {
        graphCard.style.display = 'block';
        // DOM 요소가 열린 후 그래프 렌더링을 위해 setTimeout 적용
        setTimeout(() => {
          renderChart(selectedStudentId, tab);
        }, 50);
      } else {
        graphCard.style.display = 'none'; // 학생기본정보, 출결/창체/진로 탭에서는 상자 숨김
      }

      renderSubTabView();
    }

    function updateView() {
      renderSubTabView();
      if (currentSubTab === 'grade' || currentSubTab === 'mock') {
        renderChart(selectedStudentId, currentSubTab);
      }
    }

    function renderSubTabView() {
      const view = document.getElementById('tabViewArea');
      const st = excelData["01_학생명렬표"].rows.find(r => r.학번 === selectedStudentId);
      if (!st) return;

      if (currentSubTab === 'info') {
        view.innerHTML = `
          <div class="data-row"><span class="data-label">성명/성별</span><span class="data-val">${st.성명} (${st.성별})</span></div>
          <div class="data-row"><span class="data-label">학번 정보</span><span class="data-val">${st.학번} (${st.학년}학년 ${st.반}반 ${st.번호}번)</span></div>
          <div class="data-row"><span class="data-label">생년월일</span><span class="data-val">${st.생년월일}</span></div>
          <div class="data-row"><span class="data-label">학생 연락처</span><span class="data-val">${st.학생휴대폰}</span></div>
          <div class="data-row"><span class="data-label">보호자 연락처</span><span class="data-val">${st.보호자1_성명} (${st.보호자1_관계}) - ${st.보호자1_휴대폰}</span></div>
        `;
      } else if (currentSubTab === 'grade') {
        const grades = excelData["03_내신성적"].rows.filter(r => r.학번 === selectedStudentId);
        view.innerHTML = grades.map(g => `
          <div class="item-card">
            <div class="data-row"><span class="data-label">과목명</span><span class="data-val">${g.과목명} (${g.교과})</span></div>
            <div class="data-row"><span class="data-label">원점수 / 석차등급</span><span class="data-val">${g.원점수}점 / ${g.석차등급}등급</span></div>
            <div class="data-row"><span class="data-label">과목평균 / 성취도</span><span class="data-val">${g.과목평균}점 / 성취도 ${g.성취도}</span></div>
          </div>
        `).join('');
      } else if (currentSubTab === 'mock') {
        const mocks = excelData["04_모의고사성적"].rows.filter(r => r.학번 === selectedStudentId);
        view.innerHTML = mocks.map(m => `
          <div class="item-card">
            <div class="data-row"><span class="data-label">시행년월 / 영역</span><span class="data-val">${m.시행년월} [${m.영역}]</span></div>
            <div class="data-row"><span class="data-label">표준점수 / 백분위</span><span class="data-val">${m.표준점수}점 / 백분위 ${m.백분위}%</span></div>
            <div class="data-row"><span class="data-label">등급 / 석차</span><span class="data-val">${m.등급}등급 (교내 ${m.학교내석차}위)</span></div>
          </div>
        `).join('');
      } else if (currentSubTab === 'etc') {
        const att = excelData["05_출결"].rows.find(r => r.학번 === selectedStudentId) || {};
        const act = excelData["06_창의적체험활동"].rows.find(r => r.학번 === selectedStudentId) || {};
        const car = excelData["08_진로희망"].rows.find(r => r.학번 === selectedStudentId) || {};

        view.innerHTML = `
          <div class="item-card">
            <b>📅 출결 기록</b>
            <div class="data-row"><span class="data-label">수업일수/결석</span><span class="data-val">${att.수업일수 || 190}일 / 질병 ${att.결석_질병 || 0}회</span></div>
          </div>
          <div class="item-card">
            <b>🎨 창의적 체험활동</b>
            <p style="font-size:12px; color:#555; margin-top:4px;">${act.활동명 || '수리탐구반'}: ${act.주요내용 || '프로젝트 탐구'}</p>
          </div>
          <div class="item-card">
            <b>🚀 진로 희망</b>
            <div class="data-row"><span class="data-label">희망학과/대학</span><span class="data-val">${car.희망학과1 || '컴퓨터공학'} (${car.희망대학1 || '포항공대'})</span></div>
          </div>
        `;
      }
    }

    // 💡 차트 생성 함수 (내신/모의고사별 차트 시각화)
    function renderChart(stId, tabType) {
      const ctx = document.getElementById('scoreChart').getContext('2d');
      const graphTitle = document.getElementById('graphTitle');
      if (chartInstance) chartInstance.destroy();

      if (tabType === 'grade') {
        graphTitle.innerText = "📈 내신 과목별 성적 추이 (원점수 & 석차등급)";
        const grades = excelData["03_내신성적"].rows.filter(r => r.학번 === stId);
        
        chartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: grades.map(g => g.과목명),
            datasets: [
              {
                label: '원점수',
                data: grades.map(g => parseFloat(g.원점수)),
                backgroundColor: 'rgba(0, 64, 133, 0.75)',
                yAxisID: 'y'
              },
              {
                label: '석차등급',
                data: grades.map(g => parseFloat(g.석차등급)),
                type: 'line',
                borderColor: '#dc3545',
                backgroundColor: '#dc3545',
                borderWidth: 2,
                yAxisID: 'y1'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: true, max: 100, title: { display: true, text: '점수' } },
              y1: { reverse: true, min: 1, max: 9, position: 'right', title: { display: true, text: '등급' }, grid: { drawOnChartArea: false } }
            }
          }
        });
      } else if (tabType === 'mock') {
        graphTitle.innerText = "🎯 모의고사 회차별 성적 추이 (표준점수 & 등급)";
        const mocks = excelData["04_모의고사성적"].rows.filter(r => r.학번 === stId);

        chartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: mocks.map(m => `${m.시행년월} [${m.영역}]`),
            datasets: [
              {
                label: '표준점수',
                data: mocks.map(m => parseFloat(m.표준점수)),
                backgroundColor: 'rgba(40, 167, 69, 0.75)',
                yAxisID: 'y'
              },
              {
                label: '등급',
                data: mocks.map(m => parseFloat(m.등급)),
                type: 'line',
                borderColor: '#ffc107',
                backgroundColor: '#ffc107',
                borderWidth: 2,
                yAxisID: 'y1'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: false, min: 50, max: 150, title: { display: true, text: '표준점수' } },
              y1: { reverse: true, min: 1, max: 9, position: 'right', title: { display: true, text: '등급' }, grid: { drawOnChartArea: false } }
            }
          }
        });
      }
    }
  </script>
</body>
</html>
